[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "it-ticket-priority"
version = "2.0.0"
description = "Hybrid AI/ML, RAG, prompt-engineering, and LLMOps portfolio for IT service desk decision support"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Norbert Komaromi" }
]
keywords = [
  "machine-learning",
  "nlp",
  "mlops",
  "llmops",
  "prompt-engineering",
  "retrieval-augmented-generation",
  "responsible-ai",
  "fastapi",
  "streamlit",
  "it-service-management"
]
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "scikit-learn==1.8.0",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1"
]
mlops = [
  "mlflow>=3.0,<4"
]

[project.urls]
Homepage = "https://github.com/spawn187/ai-it-service-desk-priority-predictor"
Repository = "https://github.com/spawn187/ai-it-service-desk-priority-predictor"
Issues = "https://github.com/spawn187/ai-it-service-desk-priority-predictor/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
