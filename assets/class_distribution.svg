<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390"><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:24px;font-weight:700}.l{font-size:16px}.v{font-size:14px;font-weight:700}</style><rect width="760" height="390" fill="#fff"/><text x="35" y="40" class="t">Synthetic priority distribution</text><line x1="90" y1="320" x2="720" y2="320" stroke="#9ca3af"/><g><rect x="130" y="291" width="90" height="29" fill="#dc2626"/><rect x="275" y="220" width="90" height="100" fill="#f59e0b"/><rect x="420" y="36" width="90" height="284" fill="#3b82f6"/><rect x="565" y="33" width="90" height="287" fill="#10b981"/></g><g text-anchor="middle"><text x="175" y="345" class="l">P1</text><text x="175" y="282" class="v">4.2%</text><text x="320" y="345" class="l">P2</text><text x="320" y="211" class="v">14.3%</text><text x="465" y="345" class="l">P3</text><text x="465" y="27" class="v">40.5%</text><text x="610" y="345" class="l">P4</text><text x="610" y="24" class="v">41.0%</text></g><text x="35" y="380" class="l">Imbalance is intentional: critical P1 incidents are rare and weighted more heavily during training.</text></svg>