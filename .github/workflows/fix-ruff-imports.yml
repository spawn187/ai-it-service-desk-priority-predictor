name: Fix Ruff import ordering

on:
  push:
    branches:
      - portfolio/ai-service-desk-copilot-v2
    paths:
      - ".github/workflows/fix-ruff-imports.yml"
      - "tests/test_api.py"
      - "tests/test_copilot_api.py"
      - "tests/test_inference.py"

permissions:
  contents: write

jobs:
  fix-imports:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: portfolio/ai-service-desk-copilot-v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.5

      - name: Apply deterministic import fix
        run: |
          ruff check \
            tests/test_api.py \
            tests/test_copilot_api.py \
            tests/test_inference.py \
            --select I \
            --fix

      - name: Commit fixed imports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_api.py tests/test_copilot_api.py tests/test_inference.py
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize test import ordering"
          git push origin HEAD:portfolio/ai-service-desk-copilot-v2
